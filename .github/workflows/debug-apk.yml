name: Android debug APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokemon-kids-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu Android SDK is preinstalled. Avoid setup-android@v3,
      # which currently requests a removed legacy SDK package ("tools").
      - name: Install Android SDK 36
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-kids-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
